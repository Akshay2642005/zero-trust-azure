# Checkov configuration.
#
# Every skip below is deliberate and carries a one-line reason. Do not add
# blanket skips; extend the code or add a justified entry instead.

framework:
  - terraform

compact: true
quiet: true
soft-fail: false

skip-path:
  - "**/.terraform"
  - ".git"

skip-check:
  # The root module consumes private-registry modules pinned to exact semver
  # versions (envs/dev/main.tf), not git URLs, so there is no commit hash to pin.
  - CKV_TF_1

  # The queue service is not used; only blob storage is in scope for this project.
  - CKV_AZURE_33

  # LRS is intentional for a cost-controlled development environment; changing
  # the replication strategy is a separate availability/cost decision.
  - CKV_AZURE_206

  # Customer-managed keys are out of scope: platform-managed encryption at rest
  # is sufficient for this learning environment (explicitly noted in SPEC 7.2).
  - CKV2_AZURE_1

  # Shared-key access is removed in Phase 4 (R4.4), once managed identities and
  # RBAC exist. The module already exposes shared_access_key_enabled for that.
  - CKV2_AZURE_40

  # No SAS tokens are issued; blob access goes through managed identity, so a
  # SAS expiration policy would be configuration without a consumer.
  - CKV2_AZURE_41

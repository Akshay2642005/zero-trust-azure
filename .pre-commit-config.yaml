repos:
  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.109.2
    hooks:
      - id: terraform_fmt
      - id: terraform_validate
        args:
          - --hook-config=--retry-on-error=true
      - id: terraform_tflint
        args:
          - --hook-config=--delegate-chdir

  # Run terraform-docs from the repository root so it reads .terraform-docs.yml.
  # The upstream hook changes directory into each module and loses the config.
  - repo: local
    hooks:
      - id: terraform-docs
        name: terraform docs
        entry: bash -c 'for dir in modules/*/; do terraform-docs "$dir"; done'
        language: system
        files: ^modules/.*\.tf$
        pass_filenames: false

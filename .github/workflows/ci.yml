name: CI

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TF_VERSION: "1.16.6"
  TF_IN_AUTOMATION: "true"

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - run: terraform fmt -recursive -check -diff

  validate:
    name: validate (${{ matrix.module }})
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        module: [network, storage, policy, egress]
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - name: Validate
        working-directory: modules/${{ matrix.module }}
        run: |
          terraform init -backend=false -input=false
          terraform validate

  test:
    name: test (${{ matrix.module }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        module: [network, storage, egress]
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - name: Run offline tests
        working-directory: modules/${{ matrix.module }}
        run: |
          terraform init -backend=false -input=false
          terraform test

  tflint:
    name: tflint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.64.0
      - name: Lint
        run: |
          tflint --init
          tflint --recursive --format compact

  checkov:
    name: checkov
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Checkov
        run: pip install checkov==3.3.29
      - name: Scan
        run: checkov -d . --config-file .checkov.yaml

  plan:
    name: plan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - name: Init
        env:
          TF_TOKEN_app_terraform_io: ${{ secrets.TF_TOKEN }}
        run: terraform -chdir=envs/dev init -input=false
      - name: Validate
        run: terraform -chdir=envs/dev validate
      - name: Plan (remote, speculative)
        env:
          TF_TOKEN_app_terraform_io: ${{ secrets.TF_TOKEN }}
        run: |
          set -o pipefail
          terraform -chdir=envs/dev plan -input=false -no-color | tee plan.txt
      - name: Plan summary
        if: always()
        run: |
          {
            echo "## Terraform plan"
            echo '```'
            tail -n 60 plan.txt 2>/dev/null || echo "no plan output"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
